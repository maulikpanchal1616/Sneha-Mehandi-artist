<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e5446" />
      <stop offset="100%" stop-color="#0e2f27" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe49e" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8222" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <circle cx="32" cy="32" r="28" stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.6" />
  <circle cx="32" cy="32" r="25" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="2 2" fill="none" opacity="0.8" />
  
  <!-- Intricate Henna Flower / Mandala -->
  <g transform="translate(32, 32)">
    <!-- 8 Outer Petals -->
    <path d="M 0,-20 C 5,-13 5,-7 0,0 C -5,-7 -5,-13 0,-20 Z" fill="url(#gold)" opacity="0.75" />
    <path d="M 0,20 C 5,13 5,7 0,0 C -5,7 -5,13 0,20 Z" fill="url(#gold)" opacity="0.75" />
    <path d="M -20,0 C -13,5 -7,5 0,0 C -7,-5 -13,-5 -20,0 Z" fill="url(#gold)" opacity="0.75" />
    <path d="M 20,0 C 13,5 7,5 0,0 C 7,-5 13,-5 20,0 Z" fill="url(#gold)" opacity="0.75" />
    <path d="M -14,-14 C -8,-17 -3,-10 0,0 C -10,-3 -17,-8 -14,-14 Z" fill="url(#gold)" opacity="0.7" />
    <path d="M 14,-14 C 8,-17 3,-10 0,0 C 10,-3 17,-8 14,-14 Z" fill="url(#gold)" opacity="0.7" />
    <path d="M -14,14 C -8,17 -3,10 0,0 C -10,3 -17,8 -14,14 Z" fill="url(#gold)" opacity="0.7" />
    <path d="M 14,14 C 8,17 3,10 0,0 C 10,3 17,8 14,14 Z" fill="url(#gold)" opacity="0.7" />
    
    <!-- Inner Blooms -->
    <circle cx="0" cy="0" r="8" fill="#154539" stroke="url(#gold)" stroke-width="1.2" />
    <circle cx="0" cy="0" r="5" fill="url(#gold)" />
    <circle cx="0" cy="0" r="2" fill="#0e2f27" />
  </g>
</svg>
